<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{--ink:#15201E;--mute:#6E7B78;--faint:#9BA5A2;--bg:#FAF8F5;--card:#fff;--line:#E7E2DA;
      --teal:#0E7C7B;--teal-d:#0A5A59;--teal-soft:#E4EFEE;}
    *{box-sizing:border-box;}
    body{margin:0;width:390px;height:844px;overflow:hidden;background:var(--teal-d);
      font-family:"Work Sans",-apple-system,system-ui,sans-serif;color:#fff;}
    a{color:#E9D9BE;} a:hover{color:#fff;}
    @keyframes bob{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
    .b{width:4px;border-radius:2px;background:#E9D9BE;height:44px;transform-origin:center;animation:bob 1.1s ease-in-out infinite;}
    @media (prefers-reduced-motion: reduce){.b{animation:none;transform:scaleY(.6);}}
  </style>
</helmet>

<div style="width:390px;height:844px;display:flex;flex-direction:column;background:var(--teal-d);padding:56px 24px 28px;">

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:40px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="width:8px;height:8px;border-radius:4px;background:#E06A4F;"></span>
      <span style="font-size:13px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.85);">0:14</span>
    </div>
  </div>

  <span style="font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#E9D9BE;margin-bottom:10px;">Remember this</span>
  <h1 style="font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:30px;line-height:1.12;margin:0 0 30px;color:#fff;">Just say it. Hindi,<br>English, mixed &mdash; fine.</h1>

  <div style="display:flex;align-items:center;justify-content:center;gap:5px;height:64px;margin-bottom:30px;">
    <div class="b" style="animation-delay:0s"></div><div class="b" style="animation-delay:.12s"></div><div class="b" style="animation-delay:.24s"></div><div class="b" style="animation-delay:.36s"></div><div class="b" style="animation-delay:.48s"></div><div class="b" style="animation-delay:.6s"></div><div class="b" style="animation-delay:.72s"></div><div class="b" style="animation-delay:.84s"></div><div class="b" style="animation-delay:.96s"></div><div class="b" style="animation-delay:.3s"></div><div class="b" style="animation-delay:.18s"></div><div class="b" style="animation-delay:.54s"></div><div class="b" style="animation-delay:.42s"></div><div class="b" style="animation-delay:.06s"></div><div class="b" style="animation-delay:.66s"></div><div class="b" style="animation-delay:.9s"></div><div class="b" style="animation-delay:.78s"></div><div class="b" style="animation-delay:.24s"></div>
  </div>

  <div style="padding:18px 20px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);">
    <span style="font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);display:block;margin-bottom:8px;">Hearing</span>
    <p style="font-family:'DM Serif Display',Georgia,serif;font-size:19px;line-height:1.4;margin:0;color:#fff;">Goa airport pe Rahul mila, EV startup bana raha hai, six months mein follow up karna hai&hellip;<span style="opacity:.4;">|</span></p>
  </div>

  <div style="margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:18px;">
    <div style="width:78px;height:78px;border-radius:39px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(0,0,0,.3);cursor:pointer;">
      <div style="width:26px;height:26px;border-radius:6px;background:#E06A4F;"></div>
    </div>
    <span style="font-size:13.5px;color:rgba(255,255,255,.6);">Tap to stop. We'll sort out the rest.</span>
  </div>
</div>
</x-dc>
</body>
</html>
