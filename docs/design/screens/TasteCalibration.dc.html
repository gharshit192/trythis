<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{--ink:#15201E;--mute:#6E7B78;--faint:#9BA5A2;--bg:#FAF8F5;--card:#fff;--line:#E7E2DA;
      --teal:#0E7C7B;--teal-d:#0A5A59;--teal-soft:#E4EFEE;}
    *{box-sizing:border-box;}
    body{margin:0;width:390px;height:844px;overflow:hidden;background:var(--bg);
      font-family:"Work Sans",-apple-system,system-ui,sans-serif;color:var(--ink);}
  </style>
</helmet>

<div style="width:390px;height:844px;display:flex;flex-direction:column;background:var(--bg);padding:56px 24px 28px;">

  <div style="display:flex;align-items:center;gap:14px;margin-bottom:30px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15201E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div style="flex-grow:1;height:3px;border-radius:2px;background:#E7E2DA;position:relative;">
      <div style="position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:2px;background:var(--teal);"></div>
    </div>
    <span style="font-size:12.5px;font-weight:600;color:var(--faint);">3 of 3</span>
  </div>

  <h1 style="font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:33px;line-height:1.12;margin:0 0 9px;letter-spacing:-.005em;">Which one's<br>more you?</h1>
  <p style="font-size:15.5px;line-height:1.5;color:var(--mute);margin:0 0 26px;">Four quick picks. There's no wrong answer &mdash; and you can change your mind later.</p>

  <div style="display:flex;gap:13px;">

    <div style="flex:1;border-radius:16px;overflow:hidden;background:var(--card);border:2px solid var(--teal);position:relative;box-shadow:0 2px 10px rgba(14,124,123,.10);">
      <div style="height:150px;background:linear-gradient(150deg,#CFE0DE,#9FBFBB 55%,#7FA6A2);display:flex;align-items:flex-end;padding:10px;">
        <span style="width:24px;height:24px;border-radius:12px;background:var(--teal);display:flex;align-items:center;justify-content:center;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 8"/></svg>
        </span>
      </div>
      <div style="padding:11px 13px 14px;">
        <div style="font-family:'DM Serif Display',Georgia,serif;font-size:18px;line-height:1.15;">Mountain trek</div>
        <div style="font-size:12.5px;color:var(--mute);margin-top:3px;">Early start, long walk</div>
      </div>
    </div>

    <div style="flex:1;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);">
      <div style="height:150px;background:linear-gradient(150deg,#F2E4CC,#E4C9A0 55%,#D8B37F);"></div>
      <div style="padding:11px 13px 14px;">
        <div style="font-family:'DM Serif Display',Georgia,serif;font-size:18px;line-height:1.15;">Beach resort</div>
        <div style="font-size:12.5px;color:var(--mute);margin-top:3px;">Slow mornings, no plan</div>
      </div>
    </div>

  </div>

  <div style="display:flex;align-items:center;justify-content:center;gap:7px;margin-top:26px;">
    <span style="width:22px;height:5px;border-radius:3px;background:var(--teal);"></span>
    <span style="width:5px;height:5px;border-radius:3px;background:var(--teal);"></span>
    <span style="width:5px;height:5px;border-radius:3px;background:#D9D3CA;"></span>
    <span style="width:5px;height:5px;border-radius:3px;background:#D9D3CA;"></span>
  </div>

  <div style="margin-top:22px;padding:13px 15px;border-radius:13px;background:var(--teal-soft);display:flex;gap:11px;align-items:flex-start;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0E7C7B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span style="font-size:13px;line-height:1.45;color:var(--teal-d);">This only shapes your first few days. After that we go by what you actually save and try.</span>
  </div>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:12px;">
    <button style="width:100%;height:54px;border:0;border-radius:12px;background:var(--teal);color:#fff;font-family:'Work Sans',sans-serif;font-size:16.5px;font-weight:600;cursor:pointer;">Next</button>
    <p style="font-size:13.5px;color:var(--faint);margin:0;text-align:center;font-weight:500;">Skip this</p>
  </div>
</div>
</x-dc>
</body>
</html>
