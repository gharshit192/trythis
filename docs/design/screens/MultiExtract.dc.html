<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{--ink:#15201E;--mute:#6E7B78;--faint:#9BA5A2;--bg:#FAF8F5;--card:#fff;--line:#E7E2DA;
      --teal:#0E7C7B;--teal-d:#0A5A59;--teal-soft:#E4EFEE;}
    *{box-sizing:border-box;}
    body{margin:0;width:390px;height:844px;overflow:hidden;background:var(--bg);
      font-family:"Work Sans",-apple-system,system-ui,sans-serif;color:var(--ink);}
    a{color:var(--teal);} a:hover{color:var(--teal-d);}
  </style>
</helmet>

<div style="width:390px;height:844px;display:flex;flex-direction:column;background:var(--bg);padding:56px 24px 28px;">

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15201E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    <span style="font-size:13px;color:var(--faint);">@delhifoodwalks &middot; 0:42</span>
  </div>

  <h1 style="font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:30px;line-height:1.12;margin:0 0 8px;">This reel has<br>5 places in it.</h1>
  <p style="font-size:15px;line-height:1.5;color:var(--mute);margin:0 0 20px;">Untick anything you don't want. We'll keep them together.</p>

  <div style="display:flex;flex-direction:column;gap:8px;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div onClick="{{r.pick}}" style="{{r.style}}">
        <div style="width:44px;height:44px;border-radius:11px;flex-shrink:0;background:{{r.bg}};display:flex;align-items:center;justify-content:center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{r.fg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h12v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M16 10h2a2 2 0 0 1 0 4h-2"/><path d="M7 4v2M10 4v2M13 4v2"/></svg></div>
        <div style="display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0;">
          <span style="font-family:'DM Serif Display',Georgia,serif;font-size:17px;line-height:1.2;">{{r.name}}</span>
          <span style="font-size:12.5px;color:#6E7B78;">{{r.meta}}</span>
        </div>
        <div style="{{r.boxStyle}}">
          <sc-if value="{{r.on}}" hint-placeholder-val="{{true}}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 8"/></svg>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="display:flex;align-items:center;gap:10px;margin-top:18px;padding:13px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E7C7B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    <span style="font-size:14px;flex-grow:1;">Add to <strong>Delhi cafes</strong></span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9BA5A2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </div>

  <div style="margin-top:auto;">
    <button style="width:100%;height:54px;border:0;border-radius:12px;background:var(--teal);color:#fff;font-family:'Work Sans',sans-serif;font-size:16.5px;font-weight:600;cursor:pointer;">{{cta}}</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { off: ['Coast Cafe'] }; }
  renderVals(){
    const places = [
      ['Blue Tokai','Hauz Khas Village · ₹400 for two','#E4EFEE','#0E7C7B'],
      ['Kunzum','Hauz Khas · bookshop cafe','#ECE8F3','#6B5B95'],
      ['Elma’s Bakery','Hauz Khas · cakes, brunch','#F6EDD6','#C99425'],
      ['Coast Cafe','Hauz Khas · rooftop, ₹900','#F1E7DF','#8B5E3C'],
      ['Naivedyam','Hauz Khas · South Indian','#E4EFEE','#0E7C7B']
    ];
    const off = this.state.off;
    const rows = places.map(([name, meta, bg, fg]) => {
      const on = off.indexOf(name) === -1;
      return {
        name, meta, bg, fg, on,
        style: 'display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:14px;cursor:pointer;'
          + (on ? 'background:#fff;border:1.5px solid #0E7C7B;' : 'background:#fff;border:1px solid #E7E2DA;opacity:.6;'),
        boxStyle: 'width:24px;height:24px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;'
          + (on ? 'background:#0E7C7B;' : 'border:1.5px solid #C9CFCC;'),
        pick: () => this.setState({ off: on ? off.concat([name]) : off.filter(x => x !== name) })
      };
    });
    const n = rows.filter(r => r.on).length;
    return { rows, cta: 'Save ' + n + (n === 1 ? ' place' : ' places') };
  }
}
</script>
</body>
</html>
