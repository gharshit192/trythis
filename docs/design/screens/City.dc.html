<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{--ink:#15201E;--mute:#6E7B78;--faint:#9BA5A2;--bg:#FAF8F5;--card:#fff;--line:#E7E2DA;
      --teal:#0E7C7B;--teal-d:#0A5A59;--teal-soft:#E4EFEE;--sand:#E9D9BE;}
    *{box-sizing:border-box;}
    body{margin:0;width:390px;height:844px;overflow:hidden;background:var(--bg);
      font-family:"Work Sans",-apple-system,system-ui,sans-serif;color:var(--ink);}
    a{color:var(--teal);} a:hover{color:var(--teal-d);}
  </style>
</helmet>

<div style="width:390px;height:844px;display:flex;flex-direction:column;background:var(--bg);padding:56px 24px 28px;">

  <div style="display:flex;align-items:center;gap:14px;margin-bottom:34px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15201E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div style="flex-grow:1;height:3px;border-radius:2px;background:#E7E2DA;position:relative;">
      <div style="position:absolute;left:0;top:0;bottom:0;width:50%;border-radius:2px;background:var(--teal);"></div>
    </div>
    <span style="font-size:12.5px;font-weight:600;color:var(--faint);">1 of 2</span>
  </div>

  <h1 style="font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:33px;line-height:1.12;margin:0 0 9px;letter-spacing:-.005em;">Where are you<br>mostly around?</h1>
  <p style="font-size:15.5px;line-height:1.5;color:var(--mute);margin:0 0 26px;">So "near you" actually means near you.</p>

  <button style="display:flex;align-items:center;gap:12px;width:100%;height:56px;padding:0 16px;margin-bottom:22px;border:1.5px solid var(--teal);border-radius:12px;background:var(--teal-soft);cursor:pointer;text-align:left;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E7C7B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M22 12h-3M5 12H2"/><circle cx="12" cy="12" r="8"/></svg>
    <span style="font-family:'Work Sans',sans-serif;font-size:16px;font-weight:600;color:var(--teal);">Use my current location</span>
  </button>

  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
    <div style="flex-grow:1;height:1px;background:var(--line);"></div>
    <span style="font-size:12.5px;color:var(--faint);">or pick one</span>
    <div style="flex-grow:1;height:1px;background:var(--line);"></div>
  </div>

  <div style="display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:var(--card);margin-bottom:18px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BA5A2" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <span style="font-size:15.5px;color:var(--faint);">Search a city</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:9px;">
    <div style="display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 16px;border:1.5px solid var(--teal);border-radius:12px;background:var(--card);">
      <div style="display:flex;flex-direction:column;gap:2px;">
        <span style="font-size:16px;font-weight:600;">Delhi NCR</span>
        <span style="font-size:12.5px;color:var(--teal);font-weight:500;">Fully mapped &middot; 78 places ready</span>
      </div>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="#0E7C7B" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="11" stroke="none"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);">
      <div style="display:flex;flex-direction:column;gap:2px;">
        <span style="font-size:16px;font-weight:600;">Mumbai</span>
        <span style="font-size:12.5px;color:var(--faint);">Coming soon &middot; your saves still work</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);">
      <div style="display:flex;flex-direction:column;gap:2px;">
        <span style="font-size:16px;font-weight:600;">Bengaluru</span>
        <span style="font-size:12.5px;color:var(--faint);">Coming soon &middot; your saves still work</span>
      </div>
    </div>
  </div>

  <div style="margin-top:auto;">
    <button style="width:100%;height:54px;border:0;border-radius:12px;background:var(--teal);color:#fff;font-family:'Work Sans',sans-serif;font-size:16.5px;font-weight:600;cursor:pointer;">Continue</button>
  </div>
</div>
</x-dc>
</body>
</html>
