<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{--ink:#15201E;--mute:#6E7B78;--faint:#9BA5A2;--bg:#FAF8F5;--card:#fff;--line:#E7E2DA;
      --teal:#0E7C7B;--teal-d:#0A5A59;--teal-soft:#E4EFEE;}
    *{box-sizing:border-box;}
    body{margin:0;width:390px;height:844px;overflow:hidden;background:var(--teal-d);
      font-family:"Work Sans",-apple-system,system-ui,sans-serif;color:var(--ink);}
    a{color:var(--teal);} a:hover{color:var(--teal-d);}
  </style>
</helmet>

<div style="width:390px;height:844px;display:flex;flex-direction:column;background:var(--teal-d);padding:56px 24px 28px;">

  <div style="display:flex;justify-content:flex-end;margin-bottom:40px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;">
    <div style="width:96px;height:96px;border-radius:48px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.22);margin-bottom:24px;display:flex;align-items:center;justify-content:center;"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#E9D9BE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 8"/></svg></div>
    <span style="font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#E9D9BE;margin-bottom:12px;">Tried it</span>
    <h1 style="font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:34px;line-height:1.1;margin:0 0 8px;color:#fff;">Blue Tokai,<br>Hauz Khas</h1>
    <span style="font-size:14.5px;color:rgba(255,255,255,.7);">Saved 12 days ago &middot; tried today</span>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:38px;">
    <span style="font-size:14px;color:rgba(255,255,255,.75);">Worth it?</span>
    <div style="display:flex;gap:10px;">
      <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
        <div onClick="{{s.pick}}" style="width:46px;height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.6l-5.8 3.1 1.1-6.5L2.6 9.6l6.5-.9z"/></svg>
        </div>
      </sc-for>
    </div>
    <span style="font-size:14px;font-weight:500;color:#E9D9BE;min-height:20px;">{{label}}</span>
  </div>

  <div style="display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);margin-top:26px;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    <span style="font-size:15px;color:rgba(255,255,255,.6);">A note for future you</span>
  </div>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:14px;">
    <p style="font-size:13.5px;color:rgba(255,255,255,.6);margin:0;text-align:center;">That's 11 tried this year. 24 to go.</p>
    <button style="width:100%;height:54px;border:0;border-radius:12px;background:#fff;color:var(--teal-d);font-family:'Work Sans',sans-serif;font-size:16.5px;font-weight:600;cursor:pointer;">Done</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { n: 4 }; }
  renderVals(){
    const labels = ['', 'Not for me', 'Meh', 'Good', 'Really good', 'Would go again'];
    const n = this.state.n;
    const stars = [1,2,3,4,5].map(i => ({
      fill: i <= n ? '#E9D9BE' : 'none',
      stroke: i <= n ? '#E9D9BE' : 'rgba(255,255,255,.45)',
      pick: () => this.setState({ n: i })
    }));
    return { stars, label: labels[n] };
  }
}
</script>
</body>
</html>
