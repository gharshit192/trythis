<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{--ink:#15201E;--mute:#6E7B78;--faint:#9BA5A2;--bg:#FAF8F5;--card:#fff;--line:#E7E2DA;
      --teal:#0E7C7B;--teal-d:#0A5A59;--teal-soft:#E4EFEE;--gold:#C99425;--gold-soft:#F6EDD6;
      --plum:#6B5B95;--plum-soft:#ECE8F3;--clay:#8B5E3C;--clay-soft:#F1E7DF;}
    *{box-sizing:border-box;}
    body{margin:0;width:390px;height:844px;overflow:hidden;background:var(--bg);
      font-family:"Work Sans",-apple-system,system-ui,sans-serif;color:var(--ink);}
  </style>
</helmet>

<div style="width:390px;height:844px;position:relative;background:rgba(21,32,30,.45);">
  <div style="position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 24px 30px;">
    <div style="width:38px;height:4px;border-radius:2px;background:#DCD6CC;margin:0 auto 20px;"></div>

    <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:22px;">
      <div style="width:60px;height:60px;border-radius:15px;margin-bottom:14px;background:linear-gradient(145deg,#DCD3C6,#BFB3A2 60%,#A99B88);"></div>
      <div style="font-family:'DM Serif Display',Georgia,serif;font-size:25px;line-height:1.15;text-align:center;">Did you make it to<br>Coast Cafe?</div>
      <div style="font-size:13.5px;color:var(--mute);margin-top:6px;text-align:center;">You planned it for Saturday.</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;">
      <div style="display:flex;gap:13px;align-items:center;padding:15px 14px;border-radius:13px;background:var(--card);border:1px solid var(--line);"><span style="width:38px;height:38px;border-radius:19px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;">&#10003;</span><div style="display:flex;flex-direction:column;gap:2px;flex-grow:1;"><span style="font-size:15.5px;font-weight:600;">Yes, went</span><span style="font-size:12.5px;color:var(--mute);">We will ask how it was</span></div></div>
      <div style="display:flex;gap:13px;align-items:center;padding:15px 14px;border-radius:13px;background:var(--card);border:1px solid var(--line);"><span style="width:38px;height:38px;border-radius:19px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;">&#8635;</span><div style="display:flex;flex-direction:column;gap:2px;flex-grow:1;"><span style="font-size:15.5px;font-weight:600;">Not yet</span><span style="font-size:12.5px;color:var(--mute);">Keep it in Planning</span></div></div>
      <div style="display:flex;gap:13px;align-items:center;padding:15px 14px;border-radius:13px;background:var(--card);border:1px solid var(--line);"><span style="width:38px;height:38px;border-radius:19px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;">&#215;</span><div style="display:flex;flex-direction:column;gap:2px;flex-grow:1;"><span style="font-size:15.5px;font-weight:600;">Changed my mind</span><span style="font-size:12.5px;color:var(--mute);">Move it out of the way</span></div></div>
    </div>

    <div style="padding:13px 14px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:flex;gap:11px;align-items:flex-start;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E7B78" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px;"><path d="M12 18.5a2.5 2.5 0 0 0 2.5-2.5v-6a2.5 2.5 0 0 0-5 0v6a2.5 2.5 0 0 0 2.5 2.5z"/><path d="M6 13v3a6 6 0 0 0 12 0v-3M12 22v-3"/></svg>
      <span style="font-size:12.5px;line-height:1.45;color:var(--mute);">Or just tell us &mdash; &ldquo;loved the views, food was average&rdquo;. That teaches it more than a star ever will.</span>
    </div>

    <p style="font-size:13.5px;color:var(--faint);margin:18px 0 0;text-align:center;font-weight:500;">Do not ask about this one again</p>
  </div>
</div>
</x-dc>
</body>
</html>
