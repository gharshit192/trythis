<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{--ink:#15201E;--mute:#6E7B78;--faint:#9BA5A2;--bg:#FAF8F5;--card:#fff;--line:#E7E2DA;
      --teal:#0E7C7B;--teal-d:#0A5A59;--teal-soft:#E4EFEE;--sand:#E9D9BE;--mustard:#C99425;--brown:#8B5E3C;--plum:#6B5B95;}
    *{box-sizing:border-box;}
    body{margin:0;width:390px;height:844px;overflow:hidden;background:var(--teal-d);
      font-family:"Work Sans",-apple-system,system-ui,sans-serif;color:var(--ink);}
    a{color:var(--teal);} a:hover{color:var(--teal-d);}
  </style>
</helmet>

<div style="width:390px;height:844px;position:relative;background:var(--teal-d);display:flex;flex-direction:column;">

  <!-- collage of what you save -->
  <div style="position:absolute;inset:0;overflow:hidden;">
    <div style="position:absolute;top:96px;left:-34px;width:186px;height:246px;border-radius:18px;background:linear-gradient(150deg,#1C8F7E,#0C5F5E);transform:rotate(-8deg);"></div>
    <div style="position:absolute;top:52px;left:176px;width:172px;height:228px;border-radius:18px;background:linear-gradient(150deg,#D8A945,#A66F2A);transform:rotate(6deg);"></div>
    <div style="position:absolute;top:300px;left:118px;width:196px;height:200px;border-radius:18px;background:linear-gradient(150deg,#8E7BB0,#5C4C85);transform:rotate(-3deg);"></div>
    <div style="position:absolute;top:268px;left:-48px;width:150px;height:172px;border-radius:18px;background:linear-gradient(150deg,#A8724A,#6F4529);transform:rotate(9deg);"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,90,89,.35) 0%,rgba(10,90,89,.72) 46%,#0A5A59 74%);"></div>
  </div>

  <div style="position:relative;margin-top:auto;padding:0 28px 44px;display:flex;flex-direction:column;gap:0;">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:22px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E9D9BE" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14a1 1 0 0 1 1 1v15l-8-4.5L4 20V5a1 1 0 0 1 1-1z"/></svg>
      <span style="font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#E9D9BE;">Wanna Try</span>
    </div>

    <h1 style="font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:44px;line-height:1.04;letter-spacing:-.01em;color:#fff;margin:0 0 16px;text-wrap:balance;">
      Everything you<br>saved, actually<br>done.
    </h1>
    <p style="font-size:16.5px;line-height:1.5;color:rgba(255,255,255,.76);margin:0 0 32px;max-width:300px;">
      Send us a reel, a link, a screenshot. We read it, remember it, and bring it back when you can go.
    </p>

    <div style="display:flex;flex-direction:column;gap:11px;">
      <button style="height:54px;border:0;border-radius:12px;background:#fff;color:var(--teal-d);font-family:'Work Sans',sans-serif;font-size:16.5px;font-weight:600;cursor:pointer;">Get started</button>
      <button style="height:54px;border:1px solid rgba(255,255,255,.28);border-radius:12px;background:transparent;color:#fff;font-family:'Work Sans',sans-serif;font-size:16.5px;font-weight:500;cursor:pointer;">I already have an account</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
