<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{--ink:#15201E;--mute:#6E7B78;--faint:#9BA5A2;--bg:#FAF8F5;--card:#fff;--line:#E7E2DA;
      --teal:#0E7C7B;--teal-d:#0A5A59;--teal-soft:#E4EFEE;--gold:#C99425;--gold-soft:#F6EDD6;
      --plum:#6B5B95;--plum-soft:#ECE8F3;--clay:#8B5E3C;--clay-soft:#F1E7DF;}
    *{box-sizing:border-box;}
    body{margin:0;width:390px;height:844px;overflow:hidden;background:var(--bg);
      font-family:"Work Sans",-apple-system,system-ui,sans-serif;color:var(--ink);}
  </style>
</helmet>

<div style="width:390px;height:844px;display:flex;flex-direction:column;background:var(--bg);position:relative;padding:56px 24px 28px;">
  <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:26px;">
    <div style="width:62px;height:62px;border-radius:31px;background:var(--teal);display:flex;align-items:center;justify-content:center;margin-bottom:15px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 8"/></svg>
    </div>
    <div style="font-family:'DM Serif Display',Georgia,serif;font-size:26px;line-height:1.15;text-align:center;">Saved</div>
    <div style="font-size:14px;color:var(--mute);margin-top:4px;">It is safe. We are reading it now.</div>
  </div>

  <div style="display:flex;gap:13px;align-items:center;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:26px;">
    <div style="width:48px;height:48px;border-radius:12px;flex-shrink:0;background:linear-gradient(145deg,#DCD3C6,#BFB3A2 60%,#A99B88);"></div>
    <div style="display:flex;flex-direction:column;gap:3px;flex-grow:1;min-width:0;">
      <span style="font-family:'DM Serif Display',Georgia,serif;font-size:18px;line-height:1.2;">Coast Cafe</span>
      <span style="font-size:13px;color:var(--mute);">Hauz Khas &middot; rooftop &middot; ₹900 for two</span>
    </div>
  </div>

  <div style="font-family:'DM Serif Display',Georgia,serif;font-size:22px;line-height:1.2;margin-bottom:6px;">Why this one?</div>
  <div style="font-size:13.5px;color:var(--mute);margin-bottom:16px;">One tap. It is how we know when to bring it back.</div>
  <div style="display:flex;flex-wrap:wrap;gap:9px;"><span style="padding:9px 13px;border-radius:17px;font-size:13.5px;font-weight:600;background:var(--teal);color:#fff;">Date night</span><span style="padding:9px 13px;border-radius:17px;font-size:13.5px;font-weight:500;background:var(--card);border:1px solid var(--line);">Looks amazing</span><span style="padding:9px 13px;border-radius:17px;font-size:13.5px;font-weight:500;background:var(--card);border:1px solid var(--line);">Trip idea</span><span style="padding:9px 13px;border-radius:17px;font-size:13.5px;font-weight:500;background:var(--card);border:1px solid var(--line);">A friend said so</span><span style="padding:9px 13px;border-radius:17px;font-size:13.5px;font-weight:500;background:var(--card);border:1px solid var(--line);">Maybe later</span><span style="padding:9px 13px;border-radius:17px;font-size:13.5px;font-weight:500;background:var(--card);border:1px solid var(--line);">Work-friendly</span></div>

  <div style="margin-top:20px;padding:13px 15px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:flex;gap:11px;align-items:center;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E7B78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span style="font-size:14px;flex-grow:1;">Remind me about it</span>
    <span style="font-size:13px;font-weight:600;color:var(--teal);">This weekend</span>
  </div>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:11px;">
    <button style="width:100%;height:54px;border:0;border-radius:12px;background:var(--teal);color:#fff;font-family:'Work Sans',sans-serif;font-size:16.5px;font-weight:600;">Done</button>
    <p style="font-size:13.5px;color:var(--faint);margin:0;text-align:center;font-weight:500;">Skip &mdash; just save it</p>
  </div>
</div>
</x-dc>
</body>
</html>
