<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{--ink:#15201E;--mute:#6E7B78;--faint:#9BA5A2;--bg:#FAF8F5;--card:#fff;--line:#E7E2DA;
      --teal:#0E7C7B;--teal-d:#0A5A59;--teal-soft:#E4EFEE;}
    *{box-sizing:border-box;}
    body{margin:0;width:390px;height:844px;overflow:hidden;background:var(--bg);
      font-family:"Work Sans",-apple-system,system-ui,sans-serif;color:var(--ink);}
    a{color:var(--teal);} a:hover{color:var(--teal-d);}
  </style>
</helmet>

<div style="width:390px;height:844px;display:flex;flex-direction:column;background:var(--bg);padding:56px 24px 28px;">

  <div style="display:flex;align-items:center;gap:14px;margin-bottom:34px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15201E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div style="flex-grow:1;height:3px;border-radius:2px;background:#E7E2DA;position:relative;">
      <div style="position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:2px;background:var(--teal);"></div>
    </div>
    <span style="font-size:12.5px;font-weight:600;color:var(--faint);">2 of 2</span>
  </div>

  <h1 style="font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:33px;line-height:1.12;margin:0 0 9px;letter-spacing:-.005em;">What do you<br>want more of?</h1>
  <p style="font-size:15.5px;line-height:1.5;color:var(--mute);margin:0 0 24px;">Pick a few. We'll learn the rest from what you save.</p>

  <div style="display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start;">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="10">
      <button onClick="{{c.pick}}" style="{{c.style}}">
        <span style="{{c.dotStyle}}"></span>
        <span style="font-family:'Work Sans',sans-serif;font-size:15px;font-weight:{{c.weight}};color:inherit;">{{c.label}}</span>
      </button>
    </sc-for>
  </div>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:13px;">
    <p style="font-size:13.5px;color:var(--faint);margin:0;text-align:center;">{{countLabel}}</p>
    <button style="width:100%;height:54px;border:0;border-radius:12px;background:var(--teal);color:#fff;font-family:'Work Sans',sans-serif;font-size:16.5px;font-weight:600;cursor:pointer;">Continue</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { on: ['Cafes','Street food','Weekend trips','Recipes'] }; }
  renderVals(){
    const cats = [
      ['Cafes','#0E7C7B'],['Street food','#C99425'],['Restaurants','#C99425'],
      ['Weekend trips','#0E7C7B'],['Recipes','#C99425'],['Shopping','#8B5E3C'],
      ['Fashion','#8B5E3C'],['Films & shows','#6B5B95'],['Books','#6B5B95'],
      ['Experiences','#0E7C7B'],['Fitness','#0E7C7B'],['Gadgets','#8B5E3C']
    ];
    const on = this.state.on;
    const chips = cats.map(([label, hue]) => {
      const sel = on.indexOf(label) !== -1;
      return {
        label, weight: sel ? 600 : 500,
        style: 'display:flex;align-items:center;gap:8px;height:46px;padding:0 16px;cursor:pointer;'
          + 'border-radius:23px;font-family:"Work Sans",sans-serif;'
          + (sel
              ? 'background:#0E7C7B;border:1.5px solid #0E7C7B;color:#fff;'
              : 'background:#fff;border:1px solid #E7E2DA;color:#15201E;'),
        dotStyle: 'width:8px;height:8px;border-radius:4px;flex-shrink:0;background:'
          + (sel ? 'rgba(255,255,255,.85)' : hue) + ';',
        pick: () => {
          const next = on.indexOf(label) !== -1 ? on.filter(x => x !== label) : on.concat([label]);
          this.setState({ on: next });
        }
      };
    });
    const n = on.length;
    return { chips, countLabel: n === 0 ? 'Pick at least one' : n + ' selected' };
  }
}
</script>
</body>
</html>
